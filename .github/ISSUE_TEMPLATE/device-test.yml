name: Device test (v2)
description: Report results for one TV, firmware and app build.
title: "[Device test] "
labels: [device-test]
body:
  - type: markdown
    attributes:
      value: |
        Report only tests you performed. Use Not tested or Not supported when appropriate.
        Architecture may be Unknown. Include webOS/firmware and the exact app build.
        Do not include credentials, account IDs, cookies, signed video URLs or browsing history.
  - type: input
    id: tv-model
    attributes:
      label: "TV model"
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: "Firmware"
    validations:
      required: true
  - type: input
    id: webos-version
    attributes:
      label: "webOS version"
    validations:
      required: true
  - type: input
    id: architecture
    attributes:
      label: "Architecture"
    validations:
      required: true
  - type: input
    id: root-status
    attributes:
      label: "Rooted or unrooted"
    validations:
      required: true
  - type: input
    id: install-method
    attributes:
      label: "Install method"
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: "App build SHA/version"
    validations:
      required: true
  - type: dropdown
    id: starts
    attributes:
      label: "Starts"
      options:
        - Not tested
        - Pass
        - Fail
        - Not supported
    validations:
      required: true
  - type: dropdown
    id: relaunches
    attributes:
      label: "Relaunches"
