name: Publish checked build IPKs
# Publishing creates the release tag when the token may not create refs.
on:
  push:
    branches: [playback/host-tested-v2]
    paths: [.github/workflows/publish-workflow-ipks.yml]
  workflow_dispatch:
    inputs:
      manifest:
        description: Checked prerelease manifest committed with its provenance records
        required: true
        default: docs/releases/v2.6.48-beta.1/manifest.json
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: checked-ipk-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Create the release tag at the verified source over git
        env:
          RELEASE_MANIFEST: ${{ inputs.manifest || 'docs/releases/v2.6.48-beta.1/manifest.json' }}
        # GitHub refuses the Actions token any new ref whose workflow files
        # differ from the default branch ("without `workflows` permission").
        # If this fails, create the tag elsewhere, or briefly give main the
        # source commit's .github/workflows, re-run, then restore main (done
        # for 2.6.48). The publish script verifies the tag points at the source.
        run: |
          set -euo pipefail
          source_sha="$(jq -r .source_sha "$RELEASE_MANIFEST")"
          tag="$(jq -r .tag "$RELEASE_MANIFEST")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ && "$tag" =~ ^v[0-9.]+-beta\.[0-9]+$ ]]
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists"
          else
            git fetch --depth=1 origin "$source_sha"
            if ! git push origin "$source_sha:refs/tags/$tag"; then
              # Diagnose: is the refusal about workflow files that differ from
              # the default branch? A throwaway tag at main's head tells.
              git fetch --depth=1 origin main
              if git push origin "FETCH_HEAD:refs/tags/ytaf-ci-tag-probe"; then
                echo "PROBE: tagging main's head is allowed"
                git push origin :refs/tags/ytaf-ci-tag-probe || echo "PROBE: could not delete probe tag"
              else
                echo "PROBE: tagging main's head is refused too"
              fi
              exit 1
            fi
          fi
      - name: Verify completed builds and publish both packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MANIFEST: ${{ inputs.manifest || 'docs/releases/v2.6.48-beta.1/manifest.json' }}
        run: python3 scripts/publish-workflow-ipks.py "$RELEASE_MANIFEST"
