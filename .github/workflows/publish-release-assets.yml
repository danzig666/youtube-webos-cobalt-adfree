name: Publish verified release assets

on:
  push:
    branches: [playback/host-tested-v2]
    paths:
      - .github/workflows/publish-release-assets.yml
      - scripts/publish-release-assets.py
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v2.6.13-beta.1
        type: string
      artifacts_sha:
        description: Immutable release-artifacts commit SHA
        required: true
        default: 74e3f5ae5b72fd68f78fc0c4e6850104c09d0e55
        type: string

permissions:
  contents: write

concurrency:
  group: release-assets-${{ inputs.tag || 'v2.6.13-beta.1' }}
  cancel-in-progress: false

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify artifacts and attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || 'v2.6.13-beta.1' }}
          ARTIFACTS_SHA: ${{ inputs.artifacts_sha || '74e3f5ae5b72fd68f78fc0c4e6850104c09d0e55' }}
        run: python3 scripts/publish-release-assets.py --tag "$RELEASE_TAG" --artifacts-sha "$ARTIFACTS_SHA"
