name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check out pinned upstream Cobalt sources
        uses: actions/checkout@v5
        with:
          repository: youtube/cobalt
          ref: 007628df7bddd86e53d6d151ecd122614916223d # 23.lts.6
          path: workdir/cobalt-23.lts.6
          sparse-checkout: |
            starboard
            cobalt
            net
            third_party/de265_includes
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ rsync python3
      - name: Run native policy, timing, configuration, state and seek tests
        run: bash scripts/test-native-host.sh

  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq git patch sed binutils squashfs-tools rename findutils xz-utils make

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Check Makefile
        run: make help

      - name: Check required directories
        run: |
          test -d assets
          test -d cobalt-patches
          test -d cobalt-platform
          test -d scripts
          test -d webapp

      - name: Check repository separation
        run: |
          if git ls-files | grep -E '\.(ipk|xz|tar|tar\.gz|tgz|img|crx)$'; then
            echo "Build artifacts must not be tracked in the public repository."
            exit 1
          fi

          python3 scripts/normalize-ipk-ownership.py --help
          python3 scripts/verify-ipk-container.py --help
          python3 scripts/test-ipk-tools.py
          python3 scripts/test-starterless-package.py
          python3 scripts/test-device-compatibility.py

      - name: Build injected web app
        working-directory: webapp
        run: |
          npm ci
          npm run build -- --env production --optimization-minimize

      - name: Run webapp tests
        working-directory: webapp
        run: npm test
